<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#c93427" />
    <title>Sin conexión — Alon Tools</title>
    <style>
      :root{color-scheme:light dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:grid;min-height:100vh;margin:0;place-items:center;padding:1rem;background:#f6f6fa;color:#20222c}.card{width:min(36rem,100%);padding:clamp(1.5rem,5vw,3rem);border:1px solid #d5d8e4;border-radius:1.5rem;background:#fff;box-shadow:0 18px 46px rgba(27,31,45,.1)}h1{margin:0 0 .75rem;font-size:clamp(2rem,8vw,3.5rem);letter-spacing:-.05em}p{color:#565b6d;line-height:1.6}a{display:inline-flex;min-height:2.75rem;align-items:center;margin-top:.5rem;padding:.7rem 1rem;border-radius:999px;background:#c93427;color:#fff;font-weight:800;text-decoration:none}@media(prefers-color-scheme:dark){body{background:#020617;color:#f8fafc}.card{border-color:#334155;background:#0f172a}p{color:#cbd5e1}}
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Estás sin conexión</h1>
      <p>Las herramientas locales que ya has visitado siguen disponibles. Vuelve al inicio o recupera la conexión para abrir una herramienta nueva.</p>
      <a href="/es/">Ver herramientas guardadas</a>
    </main>
  </body>
</html>
